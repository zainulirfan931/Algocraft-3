<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E9BF0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3BA10B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E9BF0" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#grad1)" filter="url(#shadow)"/>
  <!-- Voxel blocks -->
  <rect x="30" y="30" width="24" height="24" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="58" y="30" width="24" height="24" rx="4" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="30" y="58" width="24" height="24" rx="4" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="58" y="58" width="24" height="24" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <!-- Center accent -->
  <rect x="46" y="46" width="28" height="28" rx="6" fill="#FFC107"/>
  <!-- Code symbol -->
  <text x="60" y="66" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A1A2E" text-anchor="middle">&lt;/&gt;</text>
</svg>
